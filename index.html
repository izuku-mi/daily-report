<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f4" id="metaTheme">
  <title>Jana Priya Wines – Daily Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Jana Priya Wines design system: tokens */
    :root {
      --paper: #fbf8f4; --surface: #ffffff; --surface-sunk: #f3eee8; --rule: #e3dbd3; --border-strong: #857a73;
      --ink: #1f1a1c; --ink-muted: #5b5256;
      --wine: #7a1f3d; --wine-strong: #5e1530; --on-wine: #ffffff; --wine-tint: #f3e6ea;
      --gold: #e6b043; --on-gold: #2a1f05; --gold-tint: #fbefd5; --gold-ink: #7a5200;
      --success: #1f6b45; --success-tint: #e3f1e9; --critical: #a12a2a; --critical-tint: #f6dede;
      --focus-ring: #1d5fd1;
      --shadow-raised: 0 1px 2px rgba(31,26,28,0.10), 0 1px 1px rgba(31,26,28,0.06);
      --shadow-sheet: 0 -6px 20px rgba(31,26,28,0.14);
      --shadow-float: 0 6px 20px rgba(31,26,28,0.18), 0 1px 3px rgba(31,26,28,0.10);
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
      --control-h: 48px; --control-h-lg: 56px;
      --radius-sm: 6px; --radius-lg: 28px; --radius-pill: 999px;
      --font-sans: "Noto Sans Telugu", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --paper: #1a1618; --surface: #242022; --surface-sunk: #2d2729; --rule: #3b3337; --border-strong: #968a90;
      --ink: #f3ece9; --ink-muted: #bdb2b7;
      --wine: #e58aa8; --wine-strong: #f2adc3; --on-wine: #2a0f19; --wine-tint: #3b2029;
      --gold: #d9a63c; --on-gold: #20170a; --gold-tint: #3a3014; --gold-ink: #f0cf7a;
      --success: #6fcf9f; --success-tint: #1f3a2c; --critical: #f29a9a; --critical-tint: #43201f;
      --focus-ring: #8ab4ff;
      --shadow-raised: 0 0 0 1px rgba(255,255,255,0.06);
      --shadow-sheet: 0 -6px 20px rgba(0,0,0,0.5);
      --shadow-float: 0 6px 20px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);
      color-scheme: dark;
    }

    /* Type styles */
    .number-xl { font-size: 36px; line-height: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .number-lg { font-size: 28px; line-height: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .number-md { font-size: 18px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .headline { font-size: 22px; line-height: 34px; font-weight: 700; }
    .title { font-size: 18px; line-height: 28px; font-weight: 600; }
    .body { font-size: 16px; line-height: 26px; font-weight: 400; }
    .body-strong { font-size: 16px; line-height: 26px; font-weight: 600; }
    .small { font-size: 14px; line-height: 24px; font-weight: 400; }
    .label { font-size: 14px; line-height: 22px; font-weight: 600; }
    .caption { font-size: 12px; line-height: 20px; font-weight: 500; }

    * { box-sizing: border-box; font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      padding-bottom: 150px; font-size: 16px; line-height: 26px;
    }
    .ico { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: middle; }
    .mut { color: var(--ink-muted); }

    /* Buttons: pill, 48px min, wine is the only action colour */
    button {
      cursor: pointer; border: 1.5px solid transparent; border-radius: var(--radius-pill);
      min-height: var(--control-h); padding: 0 var(--space-4);
      font-size: 14px; line-height: 22px; font-weight: 600;
      background: var(--surface); color: var(--ink); border-color: var(--border-strong);
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      transition: background-color .08s linear; white-space: nowrap;
    }
    button:hover { background: var(--surface-sunk); }
    button.p { background: var(--wine); color: var(--on-wine); border-color: transparent; }
    button.p:hover { background: var(--wine-strong); }
    button.lg { min-height: var(--control-h-lg); padding: 0 var(--space-5); }
    button.sec { background: var(--surface); color: var(--ink); border-color: var(--border-strong); }
    button.sec:hover { background: var(--surface-sunk); }
    button.quiet { background: transparent; color: var(--wine); border-color: transparent; }
    button.quiet:hover { background: var(--wine-tint); }
    button.danger { background: var(--critical-tint); color: var(--critical); border-color: var(--critical); }
    button.ic, button.x {
      width: var(--control-h); height: var(--control-h); min-height: var(--control-h); padding: 0;
      background: transparent; color: var(--ink-muted); border-color: transparent; flex: none;
    }
    button.ic:hover, button.x:hover { background: var(--surface-sunk); color: var(--ink); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

    /* Inputs */
    input, select {
      width: 100%; min-height: var(--control-h);
      border: 1.5px solid var(--border-strong); border-radius: var(--radius-pill);
      padding: 0 var(--space-4); font-size: 16px; line-height: 26px; font-weight: 400;
      background: var(--surface); color: var(--ink);
    }
    input:focus, select:focus { outline: none; border-color: var(--wine); }
    input[type=number] { text-align: center; font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; padding: 0 var(--space-2); }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    input::placeholder { color: var(--ink-muted); opacity: 1; font-weight: 400; }
    .lbl, .g4 label, .f label, .pr label {
      display: block; margin: 0 0 var(--space-1) var(--space-2);
      font-size: 14px; line-height: 22px; font-weight: 600; color: var(--ink-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Header */
    .hd {
      position: sticky; top: 0; z-index: 20; background: var(--paper);
      border-bottom: 1px solid var(--rule);
      padding: calc(var(--space-2) + env(safe-area-inset-top)) var(--space-4) var(--space-3);
    }
    .hd-top { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
    .hd-brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .hd-logo {
      width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--wine-tint);
      display: flex; align-items: center; justify-content: center; flex: none;
    }
    .hd-title { font-size: 22px; line-height: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hd-sub { font-size: 12px; line-height: 20px; font-weight: 500; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hd .r { max-width: 720px; margin: var(--space-2) auto 0; display: flex; gap: var(--space-2); align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .date-pill {
      display: inline-flex; align-items: center; gap: 0;
      background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: var(--radius-pill); overflow: hidden;
    }
    .date-pill button { width: var(--control-h); height: 44px; min-height: 44px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--wine); }
    .date-pill button:hover { background: var(--wine-tint); }
    .date-pill input {
      width: auto; min-height: 44px; border: 0; border-radius: 0; background: transparent;
      padding: 0 var(--space-2); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center;
    }
    .chip-btn { background: transparent; color: var(--wine); border-color: transparent; }
    .chip-btn:hover { background: var(--wine-tint); }
    .lang-chip { min-height: 40px; padding: 0 var(--space-3); font-size: 12px; line-height: 20px; background: var(--wine-tint); color: var(--wine); border-color: transparent; }
    .lang-chip:hover { background: var(--wine-tint); }

    /* Layout */
    .wrap { max-width: 720px; margin: 0 auto; padding: var(--space-4); display: grid; gap: var(--space-4); }

    /* Hero KPI */
    .kpi {
      border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-raised);
      display: flex; flex-direction: column; gap: var(--space-1); min-width: 0;
    }
    .kpi.hero { background: var(--wine); color: var(--on-wine); }
    .kpi-value { align-self: flex-start; border-bottom: 3px solid var(--gold); padding-bottom: 2px; overflow-wrap: anywhere; }
    .kpi-label, .kpi-note { color: var(--on-wine); }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-lg);
      padding: var(--space-4); color: var(--ink);
    }
    .top { display: flex; align-items: center; gap: var(--space-2); margin: -4px -8px 0 0; }
    .top b { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 16px; line-height: 26px; font-weight: 600; }
    .bd {
      display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 28px; padding: 0 var(--space-3);
      border-radius: var(--radius-pill); background: var(--surface-sunk); color: var(--ink-muted);
      font-size: 12px; line-height: 20px; font-weight: 600; flex: none;
    }
    .g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); margin: var(--space-3) 0 var(--space-2); }
    .pr { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin: 0 0 var(--space-3); }
    .ft {
      display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); flex-wrap: wrap;
      font-size: 14px; line-height: 24px; color: var(--ink-muted);
      background: var(--surface-sunk); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
      font-variant-numeric: tabular-nums;
    }
    .ft b { color: var(--ink); font-weight: 600; }
    .ft .amt-pill { background: var(--wine-tint); color: var(--wine); padding: 4px var(--space-3); border-radius: var(--radius-pill); }

    /* Empty state */
    .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); padding: var(--space-7) var(--space-4); }
    .empty-art { stroke: var(--ink-muted); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .empty-label { fill: var(--wine-tint); stroke: var(--wine); }
    .empty-body { color: var(--ink-muted); max-width: 32ch; }

    /* Section titles: no uppercase or letter-spacing for Telugu */
    h3 {
      margin: 0 0 var(--space-3); font-size: 18px; line-height: 28px; font-weight: 600; color: var(--ink);
      display: flex; align-items: center; gap: var(--space-2);
    }
    h3 .ico { color: var(--wine); }

    .er { display: grid; grid-template-columns: 1fr 120px var(--control-h); gap: var(--space-2); margin-bottom: var(--space-2); align-items: center; }
    .f { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-top: var(--space-4); }
    .f .w { grid-column: 1 / -1; }

    /* Floating nav + action */
    .fnav-wrap {
      position: fixed; left: var(--space-4); right: var(--space-4);
      bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
      max-width: 688px; margin: 0 auto; z-index: 20;
      display: flex; flex-direction: column; gap: var(--space-3); pointer-events: none;
    }
    .fnav-wrap > * { pointer-events: auto; }
    .fnav-action { display: flex; justify-content: flex-end; pointer-events: none; }
    .fnav-action button { pointer-events: auto; box-shadow: var(--shadow-float); }
    .fnav {
      display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-2) var(--space-2) var(--space-5);
      background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-pill); box-shadow: var(--shadow-float);
    }
    .bar-stat { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
    .bar-stat small { display: block; font-size: 12px; line-height: 20px; font-weight: 500; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-stat b { display: block; font-size: 18px; line-height: 26px; font-weight: 600; color: var(--ink); white-space: nowrap; }
    .bar-stat.net b { color: var(--wine); }
    .fnav button.sec { min-height: var(--control-h-lg); flex: none; }

    /* Bottom sheets */
    .ov {
      position: fixed; inset: 0; z-index: 40; background: rgba(31, 26, 28, .45);
      display: none; align-items: flex-end; justify-content: center;
    }
    .ov.on { display: flex; }
    .sh {
      background: var(--surface); color: var(--ink); width: 100%; max-width: 720px; max-height: 92vh; overflow: auto;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: var(--space-2) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-sheet);
    }
    .sh-handle { width: 36px; height: 4px; border-radius: var(--radius-pill); background: var(--border-strong); margin: var(--space-1) auto var(--space-3); }
    .sh h2 { margin: 0 0 var(--space-3); font-size: 22px; line-height: 34px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .sh .f input, .sh .f select { min-width: 0; }
    .li { display: flex; gap: var(--space-3); align-items: center; min-height: 56px; padding: var(--space-2) var(--space-1); border-bottom: 1px solid var(--rule); }
    .li > span { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
    .li > span.mut { font-weight: 400; font-size: 14px; }
    .li > span.bd { flex: none; }
    .li input { width: 84px; flex: none; }
    .li[onclick]:hover { background: var(--surface-sunk); }

    /* Snackbar */
    #tt {
      position: fixed; bottom: calc(170px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
      z-index: 60; background: var(--ink); color: var(--paper); border-radius: var(--radius-pill);
      padding: var(--space-2) var(--space-2) var(--space-2) var(--space-5); min-height: var(--control-h);
      font-size: 14px; line-height: 22px; font-weight: 500; display: none; max-width: 92vw; align-items: center; gap: var(--space-3);
    }
    #tt > span:only-child { padding-right: var(--space-3); }
    #tt .tt-act { margin-left: auto; background: transparent; color: var(--paper); border-color: var(--paper); min-height: 40px; }
    #tt .tt-act:hover { background: transparent; text-decoration: underline; }

    /* Report preview */
    #rv { align-items: stretch; background: var(--surface-sunk); }
    #rv .in { width: 100%; max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; height: 100%; }
    #rv .pg { flex: 1; overflow: auto; padding: var(--space-3); }
    #rv .tb {
      display: flex; gap: var(--space-2); align-items: center;
      padding: var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--rule);
    }
    #rv .tb button:not(.ic) { flex: 1; min-width: 0; padding: 0 var(--space-2); }
    #rv .tb button span { overflow: hidden; text-overflow: ellipsis; }

    /* A4 report sheet: always the light palette */
    .rp {
      width: 794px; height: 1123px; padding: 36px 40px; background: #ffffff; color: #1f1a1c;
      display: flex; flex-direction: column; font-size: 13px; line-height: 1.5; overflow: hidden;
    }
    .rp * { font-family: "Noto Sans Telugu", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .rp table { width: 714px; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
    .rp th, .rp td { padding: 0 4px; height: 36px; text-align: right; vertical-align: middle; border-bottom: 1px solid #e3dbd3; }
    .rp th { background: #f3eee8; font-size: 12px; line-height: 1.15; height: 38px; border-bottom: 1.5px solid #857a73; color: #5b5256; font-weight: 600; }
    .rp .l { text-align: left; }
    .rp .c { text-align: center; }
    .rp .hl { background: #fbf8f4; font-weight: 700; }
    .rp tfoot td { background: #f3e6ea; color: #1f1a1c; font-weight: 700; border-top: 1.5px solid #7a1f3d; border-bottom: 0; }
    .rp .sec td { height: 30px; background: #ffffff; font-size: 12px; font-weight: 700; color: #7a1f3d; text-align: left; border-bottom: 1.5px solid #7a1f3d; }
    .rp .bx { border: 1px solid #e3dbd3; border-radius: 28px; overflow: hidden; flex: 1; }
    .rp .bx h4 { margin: 0; padding: 10px 20px; background: #f3eee8; font-size: 14px; font-weight: 600; }
    .rp .ln { display: flex; justify-content: space-between; padding: 7px 20px; border-bottom: 1px solid #e3dbd3; font-variant-numeric: tabular-nums; }
    .rp .ln:last-child { border-bottom: 0; }
    .rp .ln.b { font-weight: 700; background: #fbf8f4; }
    .rp .kp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
    .rp .kp div { font-size: 12px; border: 1px solid #e3dbd3; border-radius: 28px; padding: 10px 20px; background: #fbf8f4; color: #5b5256; }
    .rp .kp b { display: block; font-size: 19px; color: #1f1a1c; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .rp .kp .kp-hero { background: #7a1f3d; border-color: #7a1f3d; color: #ffffff; }
    .rp .kp .kp-hero b { color: #ffffff; display: inline-block; border-bottom: 3px solid #e6b043; }
    .rp .bsz { display: block; margin: 0 auto; height: 22px; line-height: 20px; text-align: center; border-radius: 999px; border: 1px solid; font-size: 12px; font-weight: 700; }

    @media (max-width: 440px) {
      #rv .tb button:not(.ic) .ico { display: none; }
      .hd-logo { width: 36px; height: 36px; }
      .hd-logo svg { width: 18px; height: 24px; }
      .hd-brand { gap: var(--space-2); }
      .hd-title { font-size: 20px; line-height: 28px; }
      .hd-top > div:last-child { gap: 0 !important; }
      .hd-top button.ic { width: 44px; }
    }
    @media (max-width: 380px) {
      .g4 { gap: var(--space-1); }
      input[type=number] { font-size: 16px; padding: 0 var(--space-1); }
      .fnav { padding-left: var(--space-4); }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }

    @media print {
      body * { visibility: hidden !important; }
      #rv, #rv .in, #rv .pg, #rv .pg * { visibility: visible !important; }
      #rv { position: static !important; background: #fff !important; display: block !important; }
      #rv .tb { display: none !important; }
      #rv .pg { overflow: visible !important; padding: 0 !important; }
      .rp { box-shadow: none !important; margin: 0 !important; page-break-after: always; }
    }
  </style>
</head>

  <!-- CORE LEDGER MATH, CARRYOVER & AUDIT ENGINE                              -->
  <!-- ======================================================================= -->
  <script id="logic">
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
    const fmt = n => { n = num(n); return (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN'); };
    const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const calc = e => {
      const total = num(e.o) + num(e.r) - num(e.i);
      const sales = total - num(e.c);
      return {
        total,
        sales,
        amount: sales * num(e.rate),
        margin: sales * (num(e.rate) - num(e.cost))
      };
    };
    const sorted = L => Object.values(L.entries || {}).sort((a, b) => (a.cat === b.cat ? 0 : a.cat === 'LIQUOR' ? -1 : 1) || (a.sno || 0) - (b.sno || 0));

    function dayTotals(L) {
      const T = { liq: 0, margin: 0, beer: 0, units: 0, o: 0, r: 0, i: 0, tot: 0, c: 0 };
      sorted(L).forEach(e => {
        const k = calc(e);
        if (e.cat === 'BEER') T.beer += k.amount;
        else T.liq += k.amount;
        T.units += k.sales;
        T.margin += k.margin;
        T.o += num(e.o);
        T.r += num(e.r);
        T.i += num(e.i);
        T.tot += k.total;
        T.c += num(e.c);
      });
      T.gross = T.liq + T.beer;
      T.exp = (L.exp || []).reduce((a, x) => a + num(x.a), 0);
      T.grand = T.gross - T.exp;
      T.pp = num(L.phonePe);
      T.ot = num(L.other);
      T.net = T.grand - T.pp - T.ot;
      return T;
    }

    function prevDate(ledgers, d) {
      return Object.keys(ledgers || {}).filter(k => k < d && Object.keys(ledgers[k].entries || {}).length > 0).sort().pop() || null;
    }

    function newLedger(date, prev, sm) {
      return { date, entries: {}, exp: [{ l: 'Shop Exp', a: 0 }], phonePe: 0, other: 0, cash: null, by: '', remarks: '', reports: [] };
    }

    function snapOf(L) {
      const m = {};
      sorted(L).forEach(e => {
        const n = e.name_en + ' [' + e.size + '] ';
        m[n + 'opening'] = num(e.o);
        m[n + 'receipts'] = num(e.r);
        m[n + 'issue'] = num(e.i);
        m[n + 'closing'] = num(e.c);
        m[n + 'cost'] = num(e.cost);
        m[n + 'rate'] = num(e.rate);
      });
      m['Expenses total'] = (L.exp || []).reduce((a, x) => a + num(x.a), 0);
      m['PhonePe'] = num(L.phonePe);
      m['Other deduction'] = num(L.other);
      m['Cash counted'] = L.cash == null ? null : num(L.cash);
      return m;
    }

    function diff(a, b) {
      const o = [];
      new Set([...Object.keys(a || {}), ...Object.keys(b || {})]).forEach(k => {
        if (a[k] !== b[k]) o.push(k + ': ' + (a[k] == null ? '–' : a[k]) + ' → ' + (b[k] == null ? '–' : b[k]));
      });
      return o;
    }

    const NT = {
      en: {
        rev: (r, a, d, m) => 'Revised after R' + r + ' (' + a + '). Changes: ' + d + (m ? '; +' + m + ' more' : ''),
        over: (n, c, t) => n + ': closing ' + c + ' is more than total ' + t,
        neg: (n, t) => n + ': total stock is negative (' + t + ')',
        ns: (n, s) => n + ': negative sales (' + s + ')',
        opd: (n, o, p, f) => n + ': opening ' + o + ' differs from previous closing ' + p + ' (' + f + ')',
        miss: (n, c, f) => n + ': had closing ' + c + ' on ' + f + ' but is missing today',
        nocash: 'Cash in hand was not entered',
        cash: (c, e, d) => 'Cash counted ' + c + ' vs expected ' + e + ': ' + (d > 0 ? 'excess ' : 'short ') + fmt(Math.abs(d)),
        noexp: 'No shop expenses entered',
        nopp: 'No PhonePe/UPI amount entered'
      },
      te: {
        rev: (r, a, d, m) => 'R' + r + ' (' + a + ') తర్వాత మార్పులు చేశారు: ' + d + (m ? '; మరో ' + m : ''),
        over: (n, c, t) => n + ': ముగింపు ' + c + ' మొత్తం ' + t + ' కంటే ఎక్కువ',
        neg: (n, t) => n + ': మొత్తం స్టాక్ రుణాత్మకం (' + t + ')',
        ns: (n, s) => n + ': అమ్మకాలు రుణాత్మకం (' + s + ')',
        opd: (n, o, p, f) => n + ': ప్రారంభ ' + o + ' మునుపటి ముగింపు ' + p + ' (' + f + ') కు భిన్నం',
        miss: (n, c, f) => n + ': ' + f + ' న ముగింపు ' + c + ' ఉంది, కానీ ఈ రోజు లేదు',
        nocash: 'చేతిలో నగదు నమోదు చేయలేదు',
        cash: (c, e, d) => 'లెక్కించిన నగదు ' + c + ' / అంచనా ' + e + ': ' + (d > 0 ? 'అదనం ' : 'తక్కువ ') + fmt(Math.abs(d)),
        noexp: 'దుకాణం ఖర్చులు నమోదు కాలేదు',
        nopp: 'ఫోన్ పే / UPI మొత్తం నమోదు కాలేదు'
      }
    };

    function mkNotes(L, prev, pd, dfs, lastRep, repNo, lg, nm) {
      lg = lg || 'en';
      nm = nm || (e => e.name_en);
      const w = NT[lg], n = [], lb = e => nm(e) + ' [' + e.size + ']';
      if (lastRep && dfs.length) n.push(w.rev(repNo - 1, lastRep.at, dfs.slice(0, 5).join('; '), Math.max(0, dfs.length - 5)));
      const ents = sorted(L);
      ents.forEach(e => {
        const k = calc(e);
        if (num(e.c) > k.total) n.push(w.over(lb(e), num(e.c), k.total));
        else if (k.total < 0) n.push(w.neg(lb(e), k.total));
        else if (k.sales < 0) n.push(w.ns(lb(e), k.sales));
      });
      if (prev) {
        const fp = pd.split('-').reverse().join('/');
        ents.forEach(e => {
          const p = prev.entries[e.id], pc = p ? num(p.c) : 0;
          if (num(e.o) !== pc) n.push(w.opd(lb(e), num(e.o), pc, fp));
        });
        Object.keys(prev.entries).forEach(id => {
          const p = prev.entries[id];
          if (num(p.c) > 0 && !L.entries[id]) n.push(w.miss(lb(p), num(p.c), fp));
        });
      }
      const T = dayTotals(L);
      if (L.cash == null || L.cash === '') n.push(w.nocash);
      else {
        const d = num(L.cash) - T.net;
        if (d !== 0) n.push(w.cash(fmt(L.cash), fmt(T.net), d));
      }
      if (T.exp === 0) n.push(w.noexp);
      if (!T.pp) n.push(w.nopp);
      return n;
    }

    function paginate(n, c1, cN, rec) {
      const P = [];
      let i = 0, cap = c1;
      do {
        const t = Math.min(cap, n - i);
        P.push([i, i + t]);
        i += t;
        cap = cN;
      } while (i < n);
      const l = P[P.length - 1];
      if (l[1] - l[0] + 1 + rec > (P.length === 1 ? c1 : cN)) P.push([n, n]);
      return P;
    }

    function validBackup(o) {
      return !!o && typeof o === 'object' && o.ledgers && typeof o.ledgers === 'object' && Array.isArray(o.skus);
    }
  </script>

    function syncMasterData() {
      if (!S) return;
      const oldMaster = S.master || {};
      const nextMaster = {};
      const sm = smap();

      // Seed master entries from SKU catalog
      S.skus.forEach(s => {
        const prevM = oldMaster[s.id] || {};
        nextMaster[s.id] = {
          id: s.id,
          cat: s.cat,
          sno: s.sno || 0,
          size: s.size,
          name_en: s.name_en,
          name_te: s.name_te,
          costPrice: num(s.costPrice),
          rate: num(s.rate),
          lastClosing: num(prevM.lastClosing),
          lastActiveDate: prevM.lastActiveDate || null,
          active: Boolean(prevM.active)
        };
      });

      // Replay ledgers chronologically so each SKU's latest closing & prices stay accurate
      const sortedDates = Object.keys(S.ledgers || {}).sort();
      sortedDates.forEach(d => {
        const L = S.ledgers[d];
        Object.values(L.entries || {}).forEach(e => {
          const s = sm[e.id];
          if (!nextMaster[e.id]) {
            nextMaster[e.id] = {
              id: e.id,
              cat: e.cat || (s ? s.cat : 'LIQUOR'),
              sno: e.sno || (s ? s.sno : 0),
              size: e.size || (s ? s.size : 'N'),
              name_en: e.name_en || (s ? s.name_en : e.id),
              name_te: e.name_te || (s ? s.name_te : e.id),
              costPrice: num(e.cost),
              rate: num(e.rate),
              lastClosing: num(e.c),
              lastActiveDate: d,
              active: true
            };
          } else {
            nextMaster[e.id].lastClosing = num(e.c);
            nextMaster[e.id].lastActiveDate = d;
            nextMaster[e.id].active = true;
            if (num(e.rate) > 0) nextMaster[e.id].rate = num(e.rate);
            if (num(e.cost) > 0) nextMaster[e.id].costPrice = num(e.cost);
          }
        });
      });

      S.master = nextMaster;
    }

      if (priorDates.length > 0) {

      const rec = 13 + (S.showMargin ? 1 : 0) + (L.remarks ? 2 : 0) + Math.max(0, L.exp.length - 7);
      const P = paginate(items.length, c1, 25, rec);
      const ds = L.date.split('-').reverse().join('/');
      const wd = new Date(L.date + 'T00:00:00').toLocaleDateString(lg === 'te' ? 'te-IN' : 'en-IN', { weekday: 'long' });

      const cg = '<colgroup>' + [28, 190, 46, 50, 54, 50, 56, 56, 58, 56, 70].map(w => `<col style="width:${w}px">`).join('') + '</colgroup>';
      const th = '<thead><tr>' + [['#', 'c'], [t('brand'), 'l'], [t('size'), 'c'], [t('o')], [t('r')], [t('i')], [t('tot')], [t('c')], [t('sal'), 'hl'], [t('rate')], [t('amt'), 'hl']].map(a => `<th class="${a[1] || ''}">${a[0]}</th>`).join('') + '</tr></thead>';

      const row = it => {
        if (it.s) return `<tr class="sec"><td colspan="11">${esc(it.s)}</td></tr>`;
        const e = it.e, c = calc(e), m2 = bcol(e.size), z = v => v || '–';
        return `<tr><td class="c" style="color:#5b5256">${it.n}</td><td class="l" style="font-weight:600">${esc(nmOf(e))}</td><td class="c"><span class="bsz" style="width:${e.size.length > 1 ? 42 : 28}px;background:${m2[0]};border-color:${m2[1]};color:${m2[2]}">${esc(e.size)}</span></td><td style="color:#5b5256">${z(num(e.o))}</td><td style="color:${num(e.r) ? '#1f6b45' : '#857a73'}">${z(num(e.r))}</td><td style="color:#5b5256">${z(num(e.i))}</td><td style="font-weight:600">${c.total}</td><td style="font-weight:600">${num(e.c)}</td><td class="hl">${c.sales}</td><td style="color:#5b5256">${z(num(e.rate))}</td><td class="hl">${c.amount.toLocaleString('en-IN')}</td></tr>`;
      };

      const ln = (a, b, c) => `<div class="ln${c ? ' b' : ''}"><span>${a}</span><span>${b}</span></div>`;
      const lastRows = (() => { let j = -1; P.forEach((p, i) => { if (p[1] > p[0]) j = i; }); return j < 0 ? 0 : j; })();

      return P.map((p, pi) => {
        const first = pi === 0, last = pi === P.length - 1;
        let h = '';
        if (first) {
          h = `<div style="width:714px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid #e3dbd3;padding-bottom:12px"><div><div style="font-size:26px;font-weight:700;line-height:1.35;color:#7a1f3d">${esc(S.shop)}</div><div style="font-size:14px;font-weight:600;color:#5b5256">${t('title')}</div></div><div style="text-align:right;min-width:190px;border:1px solid #e3dbd3;border-radius:28px;background:#fbf8f4;padding:8px 22px"><div style="font-size:11px;font-weight:700;color:#5b5256">${t('date')}</div><div style="font-size:17px;font-weight:700">${ds}</div><div style="font-size:12px;font-weight:600;color:#5b5256">${esc(wd)}</div>${L.by ? `<div style="font-size:12px;font-weight:600;color:#5b5256;overflow-wrap:anywhere">${esc(tx(L.by))}</div>` : ''}</div></div>
          <div class="kp"><div>${t('gs')}<b>${fmt(X.gross)}</b></div><div>${t('texp')}<b>${fmt(X.exp)}</b></div><div>PhonePe / UPI<b>${fmt(X.pp)}</b></div><div class="kp-hero">${t('nc')}<b>${fmt(X.net)}</b></div></div>`
          + (m.notes.length
            ? `<div style="width:714px;background:#f6dede;border:1.5px solid #a12a2a;border-radius:28px;padding:9px 20px;margin-bottom:14px;color:#1f1a1c"><b style="font-size:13px;color:#a12a2a">${t('notes')} (${m.notes.length})</b><ul style="margin:5px 0 0 16px;padding:0;font-size:12px">${m.notes.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join('')}</ul>${m.notes.length > 8 ? `<div style="font-size:12px">+ ${m.notes.length - 8} more</div>` : ''}</div>`
            : `<div style="font-size:12px;font-weight:700;color:#1f6b45;margin-bottom:14px">✓ ${t('clean')}</div>`);
        } else {
          h = `<div style="width:714px;display:flex;justify-content:space-between;border-bottom:1px solid #e3dbd3;padding-bottom:8px;margin-bottom:14px;color:#5b5256;font-size:13px"><b>${esc(S.shop)}</b><span>${ds}</span></div>`;
        }

        const tf = pi === lastRows ? `<tfoot><tr><td colspan="3" class="l">${t('tl')}</td><td>${X.o}</td><td>${X.r}</td><td>${X.i}</td><td>${X.tot}</td><td>${X.c}</td><td>${X.units}</td><td>–</td><td>${X.gross.toLocaleString('en-IN')}</td></tr></tfoot>` : '';
        const tb = p[1] > p[0] || first ? `<table>${cg}${th}<tbody>${items.slice(p[0], p[1]).map(row).join('')}</tbody>${tf}</table>` : '';
        const rc = last
          ? `<div style="display:flex;gap:16px;margin-top:16px;width:714px"><div class="bx"><h4>${t('exb')}</h4>${L.exp.map(x => ln(esc(tx(x.l) || '–'), fmt(x.a))).join('')}${ln(t('texp'), fmt(X.exp), 1)}</div><div class="bx"><h4>${t('rec')}</h4>${ln(t('lqS'), fmt(X.liq))}${ln(t('beS'), fmt(X.beer))}${ln(t('gs'), fmt(X.gross), 1)}${ln(t('texp'), '- ' + fmt(X.exp))}${ln(t('grand'), fmt(X.grand), 1)}${ln(t('lpp'), '- ' + fmt(X.pp))}${ln(t('lot'), '- ' + fmt(X.ot))}${ln(t('nc'), fmt(X.net), 1)}${S.showMargin ? ln(t('gm'), fmt(X.margin)) : ''}</div></div>${L.remarks ? `<div style="margin-top:12px;width:714px;border:1px solid #e3dbd3;border-radius:28px;padding:8px 20px"><b>${t('rm')}:</b> ${esc(tx(L.remarks))}</div>` : ''}<div style="margin-top:34px;width:714px;display:flex;justify-content:space-between"><div style="width:220px;border-top:1px solid #857a73;text-align:center;padding-top:6px;font-weight:700">${t('mgr')}</div><div style="width:220px;border-top:1px solid #857a73;text-align:center;padding-top:6px;font-weight:700">${t('chk')}</div></div>`
          : '';

        return `<div class="rp">${h}${tb}${rc}<div style="margin-top:auto;width:714px;display:flex;justify-content:space-between;font-size:12px;color:#5b5256"><span>${esc(S.shop)} • Report ${m.id}${m.rev ? ' (REVISED)' : ''} • Generated ${m.at} • Generation #${m.no}</span><span>${pi + 1} / ${P.length}</span></div></div>`;
      });
    }

    function openRep() {
      const L = cur();
      if (!Object.keys(L.entries).length) {
        toast(S.lang === 'te' ? 'కనీసం ఒక బ్రాండ్ జోడించండి' : 'Add at least one brand');
        return;
      }
      const sc = Math.min(1, (innerWidth - 20) / 794), pg = buildPages(meta());
      $('rvP').innerHTML = pg.map(p => `<div style="width:${794 * sc}px;height:${1123 * sc}px;margin:0 auto 10px;overflow:hidden;box-shadow:0 1px 6px #0003"><div style="transform:scale(${sc});transform-origin:0 0">${p}</div></div>`).join('');
      op('rv');
    }

    async function mkPdf(share) {
      if (!window.jspdf || !window.html2canvas) {
        toast(S.lang === 'te' ? 'PDF లైబ్రరీ లోడ్ కాలేదు — Print / PDF బటన్ వాడండి' : 'PDF library unavailable — use Print / PDF button');
        window.print();
        return;
      }
      toast(S.lang === 'te' ? 'PDF తయారవుతోంది...' : 'Generating PDF...');
      const m = meta(), off = $('off');
      off.innerHTML = buildPages(m).join('');
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        await new Promise(r => setTimeout(r, 120));
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const els = off.querySelectorAll('.rp');
        for (let i = 0; i < els.length; i++) {
          if (i) pdf.addPage();
          const cv = await html2canvas(els[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
          pdf.addImage(cv.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, 210, 297);
        }
        const L = cur();
        const fn = (S.shop.replace(/[^a-zA-Z0-9]/g, '') || 'Report') + '_' + L.date + '_R' + m.no + '.pdf';
        L.reports.push({ id: m.id, at: m.at, by: L.by, snap: m.snap });
        save();

        const blob = pdf.output('blob');
        const f = new File([blob], fn, { type: 'application/pdf' });

        if (share && navigator.share && navigator.canShare && navigator.canShare({ files: [f] })) {
          await navigator.share({ files: [f], title: fn });
          toast('✓ Shared ' + fn);
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fn;
          a.rel = 'noopener';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 2000);
          toast('✓ Downloaded: ' + fn);
        }
        openRep();
      } catch (e) {
        if (!e || e.name !== 'AbortError') {
          console.error('PDF generation failed:', e);
          toast(S.lang === 'te' ? 'నేరుగా డౌన్‌లోడ్ సాధ్యం కాలేదు — Print డైలాగ్ తెరుస్తున్నాము' : 'Direct download blocked — opening Print / Save as PDF');
          window.print();
        }
      } finally {
        off.innerHTML = '';
      }
    }

    load();
    renderAll();
  </script>
</body>
</html>
