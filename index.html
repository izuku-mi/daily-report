<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f4" id="metaTheme">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Jana Priya Wines – Daily Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-dark_mode" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-light_mode" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-chevron_left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-chevron_right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-account_balance_wallet" viewBox="0 0 24 24"><path d="M4 7h15a1 1 0 011 1v10a1 1 0 01-1 1H5a1 1 0 01-1-1zM4 7V6a1 1 0 011-1h11M16 13h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-sync" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114-5.3L20 9M20 4v5h-5M20 12a8 8 0 01-14 5.3L4 15M4 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-add_circle" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 8v8M8 12h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8 8 8 0 00-6.3 3M4 4v4h4M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-description" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4v-7a2 2 0 012-2h12a2 2 0 012 2v7h-3M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-sell" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8zM7.5 7.5v.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-backup" viewBox="0 0 24 24"><path d="M7 18a4 4 0 01-.5-8A6 6 0 0118 9a4 4 0 01-1 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-database" viewBox="0 0 24 24"><path d="M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3zM5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-delete_forever" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs></svg>

  <!-- Material 3 Top App Bar -->
  <header class="hd">
    <div class="hd-top">
      <div class="hd-brand">
        <div class="hd-logo" aria-hidden="true"><svg width="22" height="30" viewBox="0 0 72 96"><path d="M30 6h12v14c0 6 12 10 12 22v44a6 6 0 01-6 6H24a6 6 0 01-6-6V42c0-12 12-16 12-22z" fill="var(--wine)"/><rect x="22" y="52" width="28" height="22" rx="4" fill="var(--gold)"/></svg></div>
        <div style="min-width:0">
          <div class="hd-title" id="shopH"></div>
          <div class="hd-sub" id="subH"></div>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="lang-chip" onclick="S.lang=S.lang==='te'?'en':'te';save();renderAll()" id="lg"></button>
        <button class="ic" onclick="toggleTheme()" id="thBtn" aria-label="Toggle theme"><svg class="ico" aria-hidden="true"><use href="#i-dark_mode"/></svg></button>
        <button class="ic" onclick="openSet()" aria-label="Settings"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg></button>
      </div>
    </div>
    <div class="r">
      <div class="date-pill">
        <button onclick="stepDay(-1)" aria-label="Previous day"><svg class="ico" aria-hidden="true"><use href="#i-chevron_left"/></svg></button>
        <input type="date" id="dt" onchange="goto(this.value)">
        <button onclick="stepDay(1)" aria-label="Next day"><svg class="ico" aria-hidden="true"><use href="#i-chevron_right"/></svg></button>
      </div>
      <button class="chip-btn" id="tdy" onclick="goto(iso(new Date()))"></button>
    </div>
  </header>

  <!-- Main Content Feed -->
  <main class="wrap">
    <section class="kpi hero" aria-live="polite">
      <div class="caption kpi-label" id="hL"></div>
      <div class="number-xl kpi-value" id="hV"></div>
      <div class="small kpi-note" id="hN"></div>
    </section>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="sec" id="bLoadAll" onclick="loadMasterAndOpening()" style="flex:1"></button>
    </div>
    <div id="ents" style="display:grid;gap:12px"></div>

    <!-- Cash & Expense Reconciliation Card -->
    <section class="card">
      <h3><svg class="ico" aria-hidden="true"><use href="#i-account_balance_wallet"/></svg><span id="hEx"></span></h3>
      <div id="exl"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="sec" id="bAx" onclick="addEx()"></button>
        <button class="quiet" id="bCy" onclick="copyEx()"></button>
      </div>
      <div class="f">
        <div><label id="lPp"></label><input type="number" inputmode="numeric" id="pp" onfocus="this.select()" oninput="fld('phonePe',this.value)"></div>
        <div><label id="lOt"></label><input type="number" inputmode="numeric" id="ot" onfocus="this.select()" oninput="fld('other',this.value)"></div>
        <div><label id="lCa"></label><input type="number" inputmode="numeric" id="ca" onfocus="this.select()" oninput="fld('cash',this.value)"></div>
        <div><label id="lBy"></label><input type="text" id="by" oninput="fld('by',this.value)"></div>
        <div class="w"><label id="lRm"></label><input type="text" id="rm" oninput="fld('remarks',this.value)"></div>
      </div>
    </section>
  </main>

  <!-- Material 3 Bottom App Bar + Extended FAB -->
  <footer class="fnav-wrap">
    <div class="fnav-action"><button class="p lg" id="bAd" onclick="openAdd()"></button></div>
    <nav class="fnav" aria-label="Totals">
      <div class="bar-stat"><small id="sG"></small><b id="vG"></b></div>
      <div class="bar-stat net"><small id="sN"></small><b id="vN"></b></div>
      <button class="sec" id="bRp" onclick="openRep()"></button>
    </nav>
  </footer>

  <!-- Modal Bottom Sheet 1: Add Brand -->
  <div class="ov" id="ad" onclick="if(event.target===this)cl('ad')">
    <div class="sh">
      <div class="sh-handle"></div>
      <h2><span id="adT"></span><button class="ic" onclick="cl('ad')"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button></h2>
      <input id="adQ" oninput="rAdd()" autocomplete="off" style="margin-bottom:8px">
      <div id="adL"></div>
    </div>
  </div>

  <!-- Modal Bottom Sheet 2: Settings & SKU Catalog -->
  <div class="ov" id="st" onclick="if(event.target===this){cl('st');renderAll()}">
    <div class="sh">
      <div class="sh-handle"></div>
      <h2><span id="stT"></span><button class="ic" onclick="cl('st');renderAll()"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button></h2>
      <div id="stB"></div>
    </div>
  </div>

  <!-- Fullscreen Dialog: A4 Report Preview -->
  <div class="ov" id="rv">
    <div class="in">
      <div class="pg" id="rvP"></div>
      <div class="tb">
        <button class="ic" style="flex:none" onclick="cl('rv')" aria-label="Close"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
        <button class="sec" onclick="window.print()" id="bPr"></button>
        <button class="sec" onclick="mkPdf(true)" id="bSh"></button>
        <button class="p" onclick="mkPdf(false)" id="bDl"></button>
      </div>
    </div>
  </div>

  <!-- Material 3 Snackbar -->
  <div id="tt"></div>
  <div id="off" style="position:fixed;left:-10000px;top:0"></div>

  <!-- ======================================================================= -->
  <!-- CORE LEDGER MATH, CARRYOVER & AUDIT ENGINE                              -->
  <!-- ======================================================================= -->
  

  <!-- ======================================================================= -->
  <!-- OFFLINE TELUGU <-> ENGLISH GLOSSARY & PHONETIC TRANSLITERATION ENGINE   -->
  <!-- ======================================================================= -->
  

  <!-- ======================================================================= -->
  <!-- MAIN UI CONTROLLER, OPTIONAL 19-11-2026 SAMPLE & PDF/EXPORT HANDLERS     -->
  <!-- ======================================================================= -->
  
  <script defer src="js/ledger.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
